<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Companion</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <div class="heading">
        <img src="logo.png" alt="" width="44" height="44" />
        <div>
          <h1>Browser Companion</h1>
          <p>Workshop starter: toggle your companion.</p>
        </div>
      </div>
      <label class="setting">
        <span>Bottom-right companion</span>
        <input id="cornerEnabled" type="checkbox" role="switch" disabled />
      </label>
      <label class="setting">
        <span>Clickable companion (exercise)</span>
        <input id="cornerClickable" type="checkbox" role="switch" disabled />
      </label>
      <label class="setting">
        <span>Chat mode (exercise)</span>
        <input id="chatEnabled" type="checkbox" role="switch" disabled />
      </label>
      <label class="setting">
        <span>Follow cursor (exercise)</span>
        <input id="enabled" type="checkbox" role="switch" disabled />
      </label>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
  </body>
</html>
